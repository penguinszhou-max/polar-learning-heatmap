name: Deploy POLAR Learning Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "public/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polar-learning-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read Notion and build navigation data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LEARNING_RECORDS_DATA_SOURCE_ID: ${{ secrets.LEARNING_RECORDS_DATA_SOURCE_ID }}
          CHAPTERS_DATA_SOURCE_ID: ${{ secrets.CHAPTERS_DATA_SOURCE_ID }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
