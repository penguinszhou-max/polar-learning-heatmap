name: Deploy POLAR Learning Heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polar-learning-heatmap
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read Notion and build heatmap data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LEARNING_RECORDS_DATA_SOURCE_ID: ${{ secrets.LEARNING_RECORDS_DATA_SOURCE_ID }}
          WEEKLY_TARGET_HOURS: ${{ vars.WEEKLY_TARGET_HOURS || '20' }}
        run: python scripts/build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
