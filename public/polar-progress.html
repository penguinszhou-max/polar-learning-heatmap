<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>极地学习航标</title>
<style>
:root{
  --bg:#f7fafb;--panel:rgba(255,255,255,.84);--text:#15324f;--muted:#6f8192;
  --line:rgba(123,160,187,.24);--accent:#3c7fb4;--accent2:#7ba9c8;
  --good:#3d8b6d;--shadow:0 14px 30px rgba(58,92,118,.11);--progress:0%;
}
*{box-sizing:border-box} html,body{margin:0;background:transparent;color:var(--text)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.shell{padding:10px}
.card{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(245,250,253,.87));
  box-shadow:var(--shadow)
}
.hero{
  position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(255,255,255,.92) 0 34%,rgba(244,250,253,.42) 52%,rgba(238,247,251,.08) 100%),
  url("assets/beacon-bg.webp") center/cover no-repeat;
  filter:saturate(.92);z-index:0
}
.content{position:relative;z-index:1;padding:18px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.title{font-size:22px;font-weight:780;letter-spacing:.02em}
.subtitle{font-size:11px;color:var(--muted);margin-top:4px}
.sync{font-size:10px;color:var(--muted);white-space:nowrap}
.status{margin-top:6px;text-align:right;font-size:10px;color:var(--accent)}
.metrics{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px
}
.metric{
  padding:13px 14px;border:1px solid rgba(123,160,187,.18);border-radius:14px;
  background:rgba(255,255,255,.73);backdrop-filter:blur(9px)
}
.label{font-size:11px;color:var(--muted)}
.value{font-size:22px;font-weight:760;margin-top:4px}
.note{font-size:10px;color:var(--muted);margin-top:5px}
.bar{height:5px;background:rgba(92,133,162,.15);border-radius:999px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .8s ease}
.route{
  position:relative;height:168px;margin-top:10px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(222,240,247,.08))
}
.path{
  position:absolute;left:5%;right:5%;top:88px;height:2px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.95) 0 10px,transparent 10px 18px);
  transform:skewY(-.5deg);filter:drop-shadow(0 1px 1px rgba(40,90,120,.25))
}
.marker{
  position:absolute;top:76px;transform:translateX(-50%);text-align:center
}
.marker i{display:block;width:18px;height:18px;border:5px solid white;border-radius:50%;background:#6aa3ca;box-shadow:0 2px 10px rgba(50,95,125,.22)}
.marker b{display:block;margin-top:8px;font-size:11px}
.marker small{font-size:9px;color:var(--muted)}
.current{
  position:absolute;top:42px;left:clamp(4%,var(--progress),96%);
  width:86px;height:54px;transform:translateX(-50%);
  background:url("assets/ice-marker.webp") center/cover no-repeat;
  border-radius:50%;filter:drop-shadow(0 8px 10px rgba(31,62,82,.18));
  animation:float 4s ease-in-out infinite;transition:left .9s ease
}
.footer{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin-top:7px}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
@media(max-width:760px){.metrics{grid-template-columns:1fr}.route{height:190px}.sync{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="hero"></div>
    <div class="content">
      <div class="header">
        <div>
          <div class="title">极地学习航标</div>
          <div class="subtitle">今日节奏 · 本周进度 · 整体课程推进</div>
        </div>
        <div>
          <div class="sync" id="sync">正在同步</div>
          <div class="status" id="status">—</div>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="label">今日正式学习</div>
          <div class="value" id="today">—</div>
          <div class="note" id="todayNote">—</div>
        </div>
        <div class="metric">
          <div class="label">当前学习周</div>
          <div class="value" id="week">—</div>
          <div class="note" id="weekNote">—</div>
          <div class="bar"><span id="weekBar"></span></div>
        </div>
        <div class="metric">
          <div class="label">整体课程推进</div>
          <div class="value" id="overall">—</div>
          <div class="note" id="overallNote">—</div>
          <div class="bar"><span id="overallBar"></span></div>
        </div>
      </div>

      <div class="route">
        <div class="path"></div>
        <div class="current"></div>
        <div class="marker" style="left:5%"><i></i><b>起点</b><small>课程启动</small></div>
        <div class="marker" style="left:30%"><i></i><b>基础</b><small>第1—5章</small></div>
        <div class="marker" style="left:55%"><i></i><b>动力</b><small>第6—9章</small></div>
        <div class="marker" style="left:78%"><i></i><b>极地</b><small>第10—13章</small></div>
        <div class="marker" style="left:95%"><i></i><b>验收</b><small>第14—15章</small></div>
      </div>

      <div class="footer">
        <span id="gap">实际与计划差额：—</span>
        <span>整体课程进度以正式学习时长计算</span>
      </div>
    </div>
  </div>
</div>
<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f=v=>Number(v||0).toFixed(1);
fetch("polar-progress-data.json?ts="+Date.now(),{cache:"no-store"})
.then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()})
.then(d=>{
  document.getElementById("sync").textContent="数据自动同步于 "+new Date(d.generated_at).toLocaleString("zh-CN");
  document.getElementById("status").textContent=d.today.has_record?"今日已记录正式学习":"今日尚未记录正式学习";
  document.getElementById("today").textContent=d.today.actual_minutes+"分钟";
  document.getElementById("todayNote").textContent=d.today.record_count?`${d.today.record_count}条正式记录`:"暂无正式记录";
  document.getElementById("week").textContent=`${f(d.week.actual_hours)} / ${d.week.target_hours}小时`;
  document.getElementById("weekNote").textContent=`${d.week.label} · 尚余${f(d.week.remaining_hours)}小时`;
  document.getElementById("weekBar").style.width=clamp(d.week.completion_pct,0,100)+"%";
  document.getElementById("overall").textContent=`${f(d.overall.actual_hours)} / ${d.overall.plan_total_hours}小时`;
  document.getElementById("overallNote").textContent=`已通过${d.overall.passed_chapters} / ${d.overall.total_chapters}章`;
  document.getElementById("overallBar").style.width=clamp(d.overall.completion_pct,0,100)+"%";
  document.documentElement.style.setProperty("--progress",clamp(d.overall.completion_pct,4,96)+"%");
  const gap=Number(d.overall.gap_hours||0);
  document.getElementById("gap").textContent=`实际与计划差额：${gap>=0?"+":""}${f(gap)}小时`;
})
.catch(e=>document.body.innerHTML=`<div style="padding:16px;color:#a33">加载失败：${e.message}</div>`);
</script>
</body>
</html>
